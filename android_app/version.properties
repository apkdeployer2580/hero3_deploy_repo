# APK version. Read by app/build.gradle.kts; `versionCode` is bumped automatically
# by `build_android.ps1 -Release` (and by nothing else - debug builds and IDE syncs
# leave it alone). Use -NoBump to rebuild the same code.
#
# ASCII ONLY. This file is REWRITTEN by that script, and it is also read by Java's
# Properties.load(), which decodes an InputStream as ISO-8859-1 - so anything
# non-ASCII here would be corrupted by one side or misread by the other.
#
# versionCode must STRICTLY INCREASE for every build you hand out. Android refuses
#   to install an APK whose versionCode is not higher than the installed one, and
#   Google Play refuses one that has already been uploaded. It is an integer with no
#   meaning beyond "newer is bigger"; it is not the version users see.
# versionName is the string users DO see (Play listing, app info). Edit it by hand
#   when a release is worth a new name; nothing rewrites it.
versionCode=458
versionName=0.1.0
