# ── LEVEL CAP 70 -> 99 (111차, 2026-09-19, player decision) ──────────────────
#
# The original title levelled to 70 in single play and on to 99 only through the
# carrier's network PvP, which no longer exists. The player asked for 99 in single play:
# "싱글로 99까지 레벨 제한 해제". Everything the level touches is a closed formula, not a
# table, so the cap is FIVE immediates and nothing else has to grow:
#
#   doLevelUp 0x4d690:   level = (s16)CHAR+0xe2 + 1;
#     0x4d6a8  cmp r3,#0x46 ; ble        -> the cap test        46 2b -> 63 2b  (99)
#     0x4d6ac  movs r3,#0x46 ; strh      -> the clamp value     46 23 -> 63 23  (99)
#            (the clamp arm also pins exp = expToNext and returns without the derived-
#             stat recompute, so at 99 the bar simply fills and stays — same as at 70.)
#   computeExpToNext 0x48f48 = 103*L^2 + 500*((L-1)/5) + 711  (L=99 -> 1,019,714, u32)
#   ComputeMaxHP     0x49000 = (14*L + 18*체력) * (100 + bonus%) / 100  (fits the i16 HP)
#
#   addStatPoints  0x4d610: unspent u16 clamps at 276 = 69 level-ups x 4. At 99 that is
#     98 x 4 = 392 = 0xc4 << 1, so the `movs r3,#0x8a` in front of the `lsls #1` becomes
#     `movs r3,#0xc4`:                                        0x4d628  8a 23 -> c4 23
#   addSkillPoints 0x4d648: unspent u8 clamps at 44 = 19 (levels 2..20, `cmp #0x14; ble`)
#     + 25 (even levels 22..70). To 99 that is 19 + 39 (22..98) = 58 = 0x3a:
#                                                             0x4d664  2c 2c -> 3a 2c
#                                                             0x4d668  2c 23 -> 3a 23
#   Without those two a hoarder's points past 70 would vanish into the old clamp; the
#   host's `items::{STAT_POINT_CAP, SKILL_POINT_CAP}` garbage ceilings move with them
#   (a reading above the ceiling is "not a character", so they MUST agree with the guest).
#
# Nothing else in the image compares the player level to 70: an imm8 sweep of `.text`
# finds `cmp #0x46` at exactly two sites — 0x4d6a8 (this) and 0x275ac (a `rand(0,100) >
# 70` roll, unrelated). The kill-EXP formula (`exp_divisor_site` RE) clamps the level
# difference to ±9 and pays `1 + enemy_exp` once the player is 5+ levels above the
# monster; the strongest wild monster is Lv 67 (`enemyh_dat`), so 71+ is reachable but
# slow from ordinary hunting — that is the ORIGINAL formula, deliberately untouched here
# (balance is the player's call; the tower's level fork and the ±9 clamp are the two knobs).
