# from floor 21 up, and the input to a forge recipe the player will add later. The
# name is not in the shipped data at all, so this is a brand-new material and needs
# THREE bytes, not one: unlike the thirteen EQUIPMENT tables (which take their size
# from the count table at 0x5370e), each consumable category's backing allocation is
# a hardcoded immediate, and the teardown loop carries its own copy of the count.
#
#   0x5e482  count table entry for cat 0x0e, read by the parse loop's `ldrsb`
#            (0x53eca entry guard / 0x53f86 continue test).       46 -> 47
#   0x53730  `movs r0,#0xe6` + `lsls #2` = 920 = 46 x 0x14 B.
#            47 x 0x14 = 940 = 0xeb << 2.                       0xe6 -> 0xeb
#   0x526a6  teardown bound `cmp r3,#0x2e` (its block's stride is
#            `movs r2,#0x14` at 0x52680, which is what identifies it as cat 0x0e).
#                                                                46 -> 47
#
# ⚠ ALL FOUR SHIP TOGETHER (asset row + these three). Any subset serves idx 0x2e out
# of a 920-byte allocation — a wild read on the first material list draw. `expect`
# pins each original byte and a mismatch is a FatalError, so a drifted build refuses
# to boot rather than overrun the heap.
#
# ★ Adding the row cannot leak the material into wild drops: every reader of the
# count table is the parse/alloc/teardown family (xref in the tool's docstring), the
# generic drop selector 0x38cf4 walks EQUIPMENT only, and consumable drops name an
# explicit (cat, idx) in the drop record.
[[entry.patch]]
pc = 0x5e482
bytes = "2f"
expect = "2e"
[[entry.patch]]
pc = 0x53730
bytes = "eb"
expect = "e6"
[[entry.patch]]
pc = 0x526a6
bytes = "2f"
expect = "2e"

