# ---------------------------------------------------------------------------
# 영웅서기 3 (Hero3) — LGT binary.mod, Ver 01.00.04 (in-game "VER 1.0.1")
# ⚠ WE DO NOT SHIP THIS ONE. An earlier revision of this comment claimed it was "the
# archive we actually ship" — that was wrong and it is the exact trap the two numbering
# schemes set (see the 01.00.07 entry above). The shipped asset is 6a352944…; this
# archive is not present in the repo at all. Kept so a 01.00.04 dump still gets blit565.
# ---------------------------------------------------------------------------
# A SECOND LGT revision of the same title (PID PD119037 / AID 0002865E), 520,308 B
# against 01.00.07's 519,952 B — a minor revision, not another full recompile: the
# whole blitter is byte-recognisable, just relocated by +0x74 (its `.text` is 0x144
# bytes longer). Entry prologue `push {r4-r7,lr}; sub sp,#0x54` at 0x2ddf0.
#
# Re-derived on this binary rather than assumed (2026-08-10), and every clause of
# the blit565_lgt contract holds instruction for instruction:
#   0x2ddf0  push {r4-r7,lr} / sub sp,#0x54      the two bytes the hook replaces
#   0x2de00  cmp r0,#0  -> bl 0x2e92e            dst == 0 early-out
#   0x2de0a  cmp r2,#0  -> bl 0x2e92e            sprite == 0 early-out, r2 = [sp,#0x74]
#                                                = caller sp+0xc = arg index 3 = `spr`
#   0x2de12  ldr r0,[r2,#8]                      pixel block, DIRECT pointer (LgtDirect)
#   0x2de18  ldrsh r3,[r2,#6] ; lsls r3,#1       2 * palette_len
#   0x2de20  ldr r4,[r2,#0xc]                    palette, direct at the RGB565 entries
#   0x2de24  adds r0,#8 ; 0x2de56 adds r4,r3,#1  pixels = data + 2*palette_len + 9
#   0x2de28  ldrb r3,[r6] ; cmp r3,#0xb          fmt 0x0b = 4bpp, else -> 0x2e5d4
#   0x2de2e  ldrh [r2] ; bmi -> (pitch+1)>>1     4bpp row bytes = ceil(pitch/2)
#   0x2ddfe  ldr r5,[sp,#0x88] = caller sp+0x20  transform, i.e. the same 13 args
# Confirmed at runtime the same way the 01.00.07 entry was: probe A/B with
# `--hle 0` vs `--hle 1`, identical frame pixel hashes.
[[entry]]
name = "Hero3 binary.mod (LGT 01.00.04)"
hash = "e76fafdd3e9e0057be8446cf7ab35577"

