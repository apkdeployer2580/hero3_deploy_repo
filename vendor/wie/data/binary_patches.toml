# ── 150차 레거시 장신구: THE THIRD OPTION (2026-10-01, player decision) ─────────────────
#
# The 11 reworked accessories (cat 0x0c idx 0x28..0x32) each gained a THIRD option, one
# source of truth `tools_re/acc_options.py` -> the generated `wie_util::acc_options`. The
# asset row cannot carry it: the item-DB parser `0x539a8` reads a record's u16 length and
# throws it away, consuming fixed fields (exactly two option pairs), so a longer record
# shifts every later row — and the world init re-parses the DB inside the very guest call
# that runs the first recompute, so a host write into a row would always lose the race.
#
# 1) The `Stat` thirds (특수공격 · 물리방어 · 방패(블록) · 쿨타임 · 물리공격 · 회피) go through the
#    game's own `addStat 0x4ee34` inside the wear recompute `0x4f014` — the only place any
#    option becomes a stat (its six `addStat` calls and nine derived getters are all in
#    there). Its slot loop has the slot's (s16) cat/idx in r1/r2 at `0x4f130 ldr r0,[sp,#0x48]`,
#    the 장비장착 PREVIEW substitution already applied, r5 = the slot, r6 = the stat block
#    (CHAR+0xb4). All 19 callers (wear, preview, unequip, load 0x5166e, stat points, buffs,
#    useItem, the state machine) pass this loop. `addStat` is a pure 16-bit add into
#    accumulators the same call zeroed: order-free, idempotent. The hook performs the
#    displaced load; guard r6 == stat block && r5 < 9, else only the load. A/B switch =
#    `stats::THIRD_OPTS_OFF` (the probe's `--third-opts 0`; the app never sets it). The host
#    effects (공격속도 · 피해감소 · 주는 피해 · the timed max-HP buffs) are not stats and are
#    ignored here. ★ 163차: MAIN ONLY with the three summary painters below (장신구 3번째 옵션
#    is 개정판; vanilla cannot obtain the 11 and keeps the game's own loop). `binary_patches/thirdopt.rs`.
[[entry.hook]]
kind = "acc_third_stat_lgt"
pc = 0x4f131       # ldr r0,[sp,#0x48] — r1/r2 = this slot's (s16) cat/idx
flavor = "main"   # 163차: 개정판 only — vanilla keeps the game's own instruction
exit_pc = 0x4f133  # lsls r3,r1,#2

# 2) The bag summary box's first line — 「레벨%d %s/%s%d」 (0x5ceb4), which the rework turns
#    into 「레벨1 장신구/저항0」 — shows the third option's summary instead (user decision ④).
#    The painter `0x41680` (가방 page 2 and the shop sell grid, `0x1f78c` -> mode 7) sprintf's
#    the line into SP+0x114 (a 0x34-byte local), fetches the graphics context, then
