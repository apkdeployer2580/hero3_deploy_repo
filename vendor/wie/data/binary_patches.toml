# ── DAMAGE 32-BIT: the player's hit carries past i16, the number draws in full (2026-09-18) ──
#
# Every damage value in the shipped game passed through a signed halfword, and a raw hit
# of 32768+ read as NEGATIVE at the fold before the cap compare and took the
# "minimum damage" branch — the 「1」 the player reported. Headless (scene 243, a def-0
# player under atk-32767 monsters): the same frames deal 1 unpatched and the cap patched.
#
# Two functions make damage and both end the same way (`lsls/asrs #16` → `cmp #0; bgt`
# → `movs #1` → cap literal):
#   0x38518  monster → player. Kept 16-bit downstream (the player's HP is i16 and no
#            monster needs to exceed it); only the fold is moved AFTER the compare so a
#            big hit clamps instead of wrapping, and the cap literal becomes 32767.
#   0x4bca0  player → monster. Made 32-bit end to end: the 3-hit accumulator
#            (0x4be5c), the fold before the compare (0x4be76), the i16 return (0x4be8e),
#            the cap literal (0x4beac = 9,999,999), both callers' folds (melee 0x4e128 /
#            0x4e1b6, projectile 0x4e860 / 0x4e8d8+0x4e8dc), `hitMonster`'s u16 entry
#            fold (0x3863e / 0x38642) and its display store (0x386fc: `str [sp+4] →
#            rec+0xfc` instead of `strh → rec+0xaa`).
# The floating-number drawer 0x1ff8 then reads that 32-bit slot: both monster callers
# pass `&rec+0xfc` (0x39b2e, 0x2a574) and its eight `ldrsh` loads / two `strh` stores
# become `ldr` / `str`. The digit renderer 0x1e6c was 32-bit already (headless: it drew
# 「1234567」 from a poked slot and 「65534」 from a real hit).
# ★ 0x2a574 reaches its record through `base+0x9c90` (= `CHAR+0x9cb8`), which is an ALIAS
#   of the `CHAR+0x9cbc` creature array and not a second one (104차-B code review): the map
#   loader stores the one `MC_knlCalloc(count * 0x158)` result into both words
#   (0x373c8 / 0x373cc, stub 0x1400264 = svc 0x76 Calloc), and every other writer of
#   `base+0x9c90` copies `[base+0x9c94]` into it (0x3106, 0x37234, 0x3b6e0, 0x3e926 —
#   the last through `base + 0x9bad + 0xe7`). Same records, same 0x158 stride (the call
#   site's own `movs r2,#0xac; lsls #1`), so the sentinel block below covers this caller.
#   Runtime: `wie_probe --dump-mem 0x150d740:8` read `40146070 40146070` on three frames
#   across a 243 -> 244 warp.
