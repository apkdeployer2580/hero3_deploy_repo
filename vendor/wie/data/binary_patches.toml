# 3) 레아의목걸이's option 2 is a NEW option id 0x78 「5초당 HP회복 +20%」 (`acc_options::
#    REGEN_STAT`: the host heals 20 % of the true max HP every 5 s of play in the field;
#    `addStat` ignores the id). The detail window names it `InGame_txt[80 + id]` = row 200
#    (`tools_re/add_regen_label.py`) and appends the '%' through `0x6d34(buf, id)`:
#        0x6d38  cmp r1,#0x12 / bhi ret         ; an id above 0x12 gets none
#        0x6d3c  movs r0,#1 / lsls r0,r1        ; then 1<<id against three masks —
#                0xf (ids 0..3) · 0x1e0 (5..8) · 0xf8<<11 (0x0e..0x12)
#        0x6d56  sprintf(buf, "%s%c", buf, '%')
#    Its 18 callers (the detail window, the summary box's orb line, the online screens) all
#    pass an `ldrsb` of a row / orb byte. The range test becomes `cmp r1,#0x78 / beq 0x6d56`
#    (0x78 appends '%'); every other id falls through to the SAME three mask tests, where
#    0x13..0x1f shift into bits 19..31 (no mask has them) and a register shift of 32 or more
#    gives 0 (ARMv4T LSL by register — `arm32_cpu`'s `shift_lsl` does the same), so the old
#    `bhi` was redundant for every value a caller can pass: the rule is unchanged for all
#    ids but 0x78. 4 bytes, both flavours; `expect` pins both original halfwords.
[[entry.patch]]
pc = 0x6d38
bytes = "78 29 0c d0"
expect = "12 29 12 d8"

# ── SKILL SP COST vs. THE RAISED LEVEL CAP (2026-09-22, player decision) ──────
#
# The SP cost is `baseSP * (100 - level - spCostReduction) / 100`. `level` (CHAR+0xe2,
# i16) is subtracted as a percent, so the 99 cap (111차) makes `100 - 99 = 1` and any
# 현자의/SP소모감소 gear (addStat 0x0e -> CHAR+0x11e) drives it negative. Two guest sites
# read `level` with an `ldrsh`: the spend fn 0x4b864 (which already floors the deducted
# amount to 5 at 0x4b8d0) and the skill-window "SP소모:%d" display 0x43dxx (no floor, so
# it printed the raw negative). See `wie_core_arm::binary_patches::spcost`.
#
# 1) Clamp the level fed to the formula to 70 (the original single-play cap) at BOTH sites.
#    Real level is untouched; the SP curve is what the game was tuned for. `exit_pc` is the
#    instruction after the displaced `ldrsh`. No-op for level <= 70, so both flavours.
[[entry.hook]]
kind = "sp_cost_level_spend_lgt"
pc = 0x4b8b1       # ldrsh r3,[r6,r0]
exit_pc = 0x4b8b3

[[entry.hook]]
kind = "sp_cost_level_disp_lgt"
pc = 0x43e37       # ldrsh r4,[r0,r5]
exit_pc = 0x43e39

# 2) Floor the DISPLAYED number at what the spend path deducts, IN THE DISPLAY'S UNITS,
#    so a build that still underflows (reduction > 30) shows no negative. ★ 129차: the
#    display divides by 10 once more than the spend path (0x43e54..56) and the SP bar is
