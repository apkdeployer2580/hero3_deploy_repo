#
# `hitMonster 0x3863c`, at `0x386cc ldr r2,[sp,#4]` — past the MISS branch (kinds 1/2
# skip to 0x38702) and before `rsbs r1,r2 / bl 0x38620`. With the folds above gone,
# `[sp+4]` is the raw 32-bit hit; the hook performs the load with `min(raw, 32767)` and,
# when the record's `rec+0x100` word holds a host-seeded virtual remainder, takes the hit
# off that word and keeps `hp_cur = 32767 * remaining / total` (`rec+0x104`, 102차-B —
# proportional, never 0 while anything remains) itself, the game applying 0; so the target
# box's bar drains like any other monster's, and the record dies through the game's own
# path once the word is spent. The DoT tick (`0x39c0a`) enters the same way. Reads of the
# record are FAIL SOFT (an unreadable one gets the clamped hit and one warn line — 104차-B).
# `r5` = the record (`adds r5,r0,#0` at 0x3864a). Ships on both flavours.
[[entry.hook]]
kind = "dmg_apply_lgt"
pc = 0x386cd
exit_pc = 0x386cf

