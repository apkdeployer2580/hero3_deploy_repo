# The game's palettised sprite blitter. It never calls MC_grpDrawImage: it takes
# the screen framebuffer pointer once and rasterises the entire world through
# this one routine, one indexed pixel at a time. A sampled guest profile of real
# field play (2026-08-06) puts 26% of ALL guest instructions inside its two inner
# loops (0x111078 = 17.8%, 0x11138c = 8.0%), which makes it the single largest
# cost in a frame and the reason heavy maps stutter.
#
# The hook replaces the first instruction, so the handler sees the caller's SP and
# reads the 13 arguments straight off it. Anything it cannot reproduce exactly —
# 4bpp, rotations, clipped-to-zero widths, unreadable memory — runs the displaced
# prologue and falls through to the original code. See `binary_patches/blit565.rs`.
[[entry.hook]]
kind = "blit565"
pc = 0x110fe5

# ---------------------------------------------------------------------------
# 영웅서기 3 (Hero3) — LGT binary.mod, Ver 01.00.07 (in-game "VER 1.0.4")
# ★ THIS IS THE ARCHIVE WE SHIP. `app_info` in
# `android_app/app/src/main/assets/hero3_fixed.zip` reads `Ver:01.00.07` and its
# `binary.mod` hashes to 6a352944…. The in-game splash says "VER 1.0.4" (an EA Korea
# build stamp at .rodata 0x5b28c), which is NOT the package version — package 01.00.04
# shows "VER 1.0.1" in-game. Do not let the two numbering schemes swap the entries:
# every hook below is verified against 6a352944 and only that binary.
# ---------------------------------------------------------------------------
# The LGT carrier build is a DIFFERENT compile of the game (no byte-level overlap
# with the KTF client.bin — even the save DB name strings differ), so nothing from
# the KTF entry transfers by address. This entry is the start of the LGT port.
#
# The blitter was found the same way the KTF one was: a sampled guest profile of
# the probe driving the opening battle scene (2026-08-10) puts the top non-idle
# leaf PCs at 0x2e59c/0x2e5b4/0x2e5c2 (~16%) — the inner loops of one function
# whose prologue is at 0x2dd7c. Instruction-level comparison against the KTF
# blitter shows IDENTICAL semantics: 13 args in the same order, fmt 0x0b = 4bpp
# high-nibble-first / 0xc = 8bpp, index 0 transparent, RGB565 palette stores,
# pixels = data + 2*palette_len + 9, 4bpp row bytes = ceil(pitch/2), odd srcX
# starts on a LOW nibble. The one difference is the sprite descriptor: +8/+0xc
# are direct pointers (KTF: allocator handles) — hence kind = "blit565_lgt".
[[entry]]
name = "Hero3 binary.mod (LGT)"
hash = "6a352944bb43c0789ca9f4b6f0702f4b"

[[entry.hook]]
kind = "blit565_lgt"
pc = 0x2dd7d

# `blendRect` — the semi-transparent rectangle fill (MIGRATION_LGT.md §2.17).
#
# Profiling a field run put ~21 % of all guest samples inside its inner loop
# (0x2b790..0x2b816), spread evenly over ~35 instructions: ~44 guest instructions PER
# PIXEL. Every menu panel, dialogue bar, HUD panel and fade goes through it, so a
# full-screen 240x320 fade is ~3.4 M guest instructions against ~1.0 M for a whole
# ordinary field frame. That is the frame-drop the player reported, and it is a
# different function from the sprite blitter above.
#
# `pc` is the OUTER row loop's first instruction (`ldr r4,[sp,#0x28]`, halfword 0x9c0a,
# branched back to from 0x2b836), so one hook finishes the whole rectangle. Everything
# it needs is already on the frame there — 0x2b784 has just stored the row count.
#
# `exit_pc` is the function's shared tail (`add sp,#0x5c; pop {r4-r7}; pop {r0}; bx r0`).
# It is reached by the two DO-NOTHING early exits — 0x2b71a when alpha is 0 and 0x2b776
# when the height is not positive — which is the proof that it cannot depend on any
# register or stack state the loop would have produced.
#
# Not added to the 01.00.04 entry below: that revision's `.text` is 0x144 bytes longer
# and this address was only ever verified on 6a352944. Locate it there before adding it.
[[entry.hook]]
kind = "blend565_lgt"
exit_pc = 0x2b8d7
pc = 0x2b787

# The LUT-blended palettised sprite blitter — the CRITICAL-HIT / skill-effect path
# (MIGRATION_LGT.md §2.20). Third and last of the game's per-pixel loops: `blit565` above
# draws opaque sprites and `blend565` fills translucent rectangles, so a translucent
# SPRITE was landing on neither, which is why the player still saw a frame drop whenever a
# critical flash was on screen after those two shipped.
#
# `pc` is the function ENTRY (`push {r4-r7,lr}`, halfword 0xb5f0) — the same shape as the
# blit565 hook, so declining runs the displaced push and resumes two bytes on. Found by
# differencing a probe profile of the intro battle (frames ~3000..4200) against one that
# stops before it: the fight doubles the samples in an evenly spread cluster at
# 0x2ea38..0x2eba6, which is this function's transform-0 pixel loop.
#
# The three tables are the arguments the host cannot derive:
#   alpha_map = .data byte table at the literal in 0x2ec64 — translates the per-sprite
#               blend argument into a plane index.
#   blend_t   = .bss planes at the literal in 0x2ec68, indexed by that translated level.
#   blend_a   = .bss planes at the literal in 0x2ec6c, indexed by the per-call level; the
#               guest skips this second stage entirely when that level is > 0xfe.
# Both plane sets are BUILT AT RUNTIME by the game, so the hook reads them out of guest
# memory per call rather than caching anything across calls.
[[entry.hook]]
kind = "blit_lut565_lgt"
alpha_map = 0x14001bf
blend_t = 0x150f8cc
blend_a = 0x150eccc
pc = 0x2e8c5

# `tintRect` — the per-pixel LUT COLOUR TRANSFORM of a rectangle already on screen, and
# the REAL cost of a critical hit (PLAY_FEEDBACK_FIXES.md 49차). It is the function
# immediately after `blendRect`, starting at 0x2b8f8, and nothing was hooking it.
#
# The three hooks above did not touch it because it is not a blitter: it takes no source
# pixels at all. Measured on the device (S25, vc79) with a per-tick hitch report and the
# guest PC profiler, which is what finally separated it from everything else:
#
#   normal tick   25 ms   inst   0.65 M   blit 569/576   hot pc 0x8=60% (idle)
#   crit   tick  124 ms   inst  16.05 M   blit 573/582   hot pc 0x2b998 0x2b99a 0x2b99e …
#
# Same blits, same ~140 K pixels, same ~1,300 SVCs, 3 allocations, no sound parse — 25x
# the guest instructions and nothing else moved. Every hot PC sits in 0x2b98e..0x2b9ea.
# (This also retires the standing §2.20 suspicion that the blitlut565 transform 4~8
# fallback was to blame: during that same combat the host drew 98.8 % of blits and the
# transform refusals ran at ~5/s against ~10,600 calls/s.)
#
# `pc` is the OUTER row loop's first instruction (`ldr r1,[sp,#8]`, halfword 0x9902,
# branched back to from 0x2b9fc), so one hook finishes the whole rectangle — the same
# shape, and the same reasoning, as the blend565_lgt hook above.
#
# `exit_pc` is the function's shared tail (`add sp,#0x34; pop {r4-r7}; pop {r0}; bx r0`).
# It is reached by three DO-NOTHING early exits — 0x2b912 when level is 255, 0x2b97e when
# the height is not positive, 0x2ba02 likewise on the 32-bit path — which is the proof it
# cannot depend on any register or stack state the loop would have produced.
#
# `blend_a` is the byte table the pixel loop indexes as
# `LUT + level*1024 + channel*32 + sel`, read from the literal at 0x2baa8. It is the SAME
# 0x150eccc the blit_lut565_lgt hook above already takes as `blend_a` — an independent
# cross-check, since that hook derived the identical level/selector layout from a
# different function. The game builds those planes at runtime, so the hook reads the
# call's plane out of guest memory rather than caching it.
#
# Not added to the 01.00.04 entry below: only ever verified against 6a352944.
[[entry.hook]]
kind = "tint_rect565_lgt"
blend_a = 0x150eccc
exit_pc = 0x2ba9d
pc = 0x2b983

# The "동기화" popup, killed at its source (PLAY_FEEDBACK_FIXES 4번).
#
# Player: "그냥 로딩끝나면 별다른 안내없이 나타나면 될거같아. 팝업을 자꾸띄우려고하니까 이거
# 이슈가 발생하는거같아." Repro: enter the warehouse, leave to the slot screen, come
# back -> the box appears; then paging in the cash shop makes it reappear every turn,
# because the client replays its whole open sequence (04 3d / 05 3d / 05 14 / 05 3f) per
# page turn.
#
# THE HANDLER (cat4 op 0x3d, the save-commit ack), verified byte for byte:
#   0x483a  ldrb r3,[r5,#0xb]      ; status
#   0x483e  cmp  r3,#0
#   0x4840  bne  0x485a            ; `0b d1`  <- patched
#   0x4842..0x4858   status == 0: netbox().flag(+0xc) = 1, then strcpy(box+0x10, msg+0xd)
#                    -- this ARMS a latch; the cat5 handler (0x13834) turns it into the box
#   0x485a..0x486a   status != 0: flag = 0, showModal(mode 3) -- a blocking WAIT
#   0x486c..0x4884   BOTH arms fall here and the client SENDS `05 3d 00`
#
# Patching the branch to an unconditional `b 0x486c` skips both arms: no latch, no modal,
# and the `05 3d 00` still goes out byte for byte. That send is the frame that asks the
# server for the warehouse list, so a cat5 round trip ALWAYS follows -- and the cat5
# handler's latch-not-set path is what writes boxMode = 0, i.e. it CLOSES the
# "슬롯 정보 서버에 저장중입니다." WAIT the client raised before uploading. Net effect is
# exactly what the player asked for: loading ends, the list appears, nothing to dismiss.
#
# Encoding: target 0x486c, so offset = 0x486c - (0x4840 + 4) = 0x28, imm11 = 0x14,
# Thumb B = 0xE014 = `14 e0`. `expect` pins the original `bne`, so a different build fails
# the install instead of corrupting an unrelated instruction.
#
# SCOPE: 0x4840 is reachable only from cat == 4 && op == 0x3d. The SAME latch is also armed
# by cat5 op 0x06 -- the 오브 결합 result toast at 0x13abc -- which keeps working untouched.
# The ack itself is NOT withheld (33차 infinite-load); only the box is skipped.
#
# ⚠ RESIDUAL RISK, watch for it: if any path ever leaves the mode-3 WAIT up with no cat5
# frame behind it, there is no longer a dismissible box to replace it. Remove this one entry
# to revert.
[[entry.patch]]
pc = 0x4840
bytes = "14 e0"
expect = "0b d1"

# ── 16TH ORB ROW: the 소켓확장 item's home (2026-08-14) ──────────────────────────
#
# The player asked for the socket-expansion item to be picked out of the NETWORK
# WAREHOUSE and pointed at a piece of equipment, "오브처럼". The game already has that
# exact flow and it is gated on ONE byte: `0x7674 cmp r3,#0x10` reads the WIRE-FED
# category of the highlighted warehouse row, and a match is the only thing that makes the
# context menu 4 rows instead of 3 — row 3 being 오브결합 (flat label table
# 0x5b404 + panel*0x10e + row*0xa). Nothing downstream re-reads the category: the row-3
# handler at 0x724e just stores the row's u64, 0x7608 validates only the TARGET
# (cat <= 0xc), and the sender at 0xc474 re-reads nothing. So the server can serve the
# socket item AS an orb and the whole picker comes for free — no client UI work.
#
# What is NOT free is the row's NAME. The item panel resolves it as `dbPtr[cat][idx]`
# out of `res/dat/i16_dat`, which ships 15 orbs (0x00..0x0e), and the orb table is
# `alloc(0xb4<<1)` = 360 B = exactly 15 x 0x18 with NO bounds check in any reader
# (0x532e8, 0x4f164). Serving idx 0x0f against the stock binary is a wild pointer read
# on the very first list draw. `tools_re/strip_orb_slot_text.py` appends a real 16th
# record (소켓확장) to the asset; these three bytes are what make the guest SEE it.
#
# ⚠ ALL FOUR SHIP TOGETHER — the asset row and these three patches. `expect` pins each
# original byte, and a mismatch is a FatalError, so a drifted build refuses to boot
# instead of quietly overrunning the heap. That is the intended failure mode.
#
# ★ Why patches and not an edit to `binary.mod`: this entry is keyed by that file's MD5.
# Editing it would stop matching, and every hook below — blit565, blend565, blitlut565 —
# would silently stop installing, costing a third to two-thirds of the guest-instruction
# budget. Patching at load time keeps the hash intact.
#
# Row count for category 0x10, in the 19-byte per-category const table at VA 0x5e474
# (`ldrsb` at 0x53eca = the parse loop's entry guard, and at 0x53f86 = its continue test).
[[entry.patch]]
pc = 0x5e484
bytes = "10"
expect = "0f"

# The orb table's backing allocation, a hardcoded immediate — `movs r0,#0xb4` feeding a
# `lsls #1` at 0x53748..0x53752. 0xb4<<1 = 360 = 15 x 0x18; 0xc0<<1 = 384 = 16 x 0x18.
# Unlike the 13 equipment tables (0x5370e) this one does NOT derive its size from the
# count table, which is why the byte above is necessary but not sufficient.
[[entry.patch]]
pc = 0x53748
bytes = "c0"
expect = "b4"

# Teardown bound, `cmp r3,#0xf` at 0x52744 — its own hardcoded copy of the count. Left at
# 15 the 16th row's two strings are never freed. Harmless per session, wrong on principle,
# and one byte to fix.
[[entry.patch]]
pc = 0x52744
bytes = "10"
expect = "0f"

