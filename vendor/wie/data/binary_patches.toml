# ── The critical-hit switch was BUILT, SHIPPED AND THEN REMOVED (2026-08-08) ──
#
# Nothing here is broken; the player simply did not want the feature ("그냥 1번 기능은 전부
# 제거해줘"). The reverse engineering is worth keeping because it is the expensive part and it
# is all device-proven — see PLAY_FEEDBACK_FIXES.md 29차/30차 for the full argument:
#
#   0x144534  the critical ROLL. rand(0,100) against a stat-derived chance clamped to 2..=60 %;
#             its byte lands at `attacker + 0x203`.
#   0x1445b8  the DAMAGE consumer of that byte: two instruction-identical blocks differing by
#             one immediate, `+0x64` (100) at 0x1446c6 vs `+0x96` (150) at 0x144774 => x1.5.
#   0x143cdc  the PRESENTATION block (per attack routine; twin at 0x143752). Entered by
#             `bne` at 0x143c36 / 0x14370a, whose fall-through is 0x143c38 / 0x14370c.
#             Plays `sd004_mf`, then calls the vibration wrapper.
#   0x147a74  that wrapper, gated on the game's own 진동 option (`*(sl+0x16c)` byte 3). Its
#             ONLY callers are 0x14376c and 0x143cf6, i.e. the two blocks above.
#
# Re-implementing means a hook at one of those and a settings row; the addresses above were
# each verified against the shipped client.bin (md5 3792a476…) byte for byte.
