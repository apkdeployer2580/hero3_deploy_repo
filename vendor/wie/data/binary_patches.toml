# ── 공격속도 / 스킬사용속도 (2026-09-23, DT — the new stat; 132차 · 132차-C rules) ─────
#
# The player's actions are POSE SCRIPTS driven by one clock: the field state machine
# `0x5089c` bumps `base+0x9ba0` once per tick (0x508bc) and each arm ends its pose step
# when that counter equals `0x4aee0(kind, facing-1, mode)` — which is just
# `sprite->frames[dir][pose] - 1` (`0x1b780`). Probe trace of one basic attack: state 2
# runs the script step (pose 2, 3 ticks), state 4 the follow-through (pose 1, 4 ticks),
# eight ticks including entry.
#
# ⛔⛔ 131차 first wrote "shortening that return value is the ONE place that shortens an
# action, and it cannot lose the hit because damage resolves when a step COMPLETES". Both
# halves were REFUTED by measurement (131차-B/D, 132차-C): a shorter answer dealt ZERO
# damage, and a hit is a FRAME EVENT — `0x4b92c(counter)`'s switch (`0x57c3c`) applies it
# on fixed frame numbers. What speeds an action up is the COUNTER, dragged (below).
#
# `0x4aee0` has six callers, all in the player's own state machine: 0x50a94 (state 2),
# 0x510ba/0x510fe (state 4) — sped up; 0x50e74 (state 3, staggered), 0x5101c (state 8,
# knocked back), 0x50ec8 (state 16, dying) — NOT. The hook sits on the function's tail
# and reads the live state byte (`0x150d63e`) to tell them apart.
#
# ⛔ The counter is dragged but NEVER past `frames - 1`: five sites compare it for
# EQUALITY, so an overshoot freezes the player mid-swing (three of those sites are
# being-hit / knockback / death), and the last tick is left to the game's own `+= 1` —
# a pose that completes in the tick it started loses its hit (132차).
#
# Displaces `lsls r0,r0,#0x18`; `exit_pc` is the `asrs r0,r0,#0x18` that finishes the
# guest's own (i8) narrowing, so the handler leaves the value pre-shifted. Off unless the
# host arms `wie_util::stats::ATTACK_SPEED_PCT`, and off is byte-identical — so it ships
# ★ 163차: MAIN ONLY with its three siblings (공격속도 is a 개정판 option; vanilla has no item
# that carries it, and keeps the game's own frame clock). See `wie_core_arm::binary_patches::atkspeed`.
# ⛔⛔ THIS HOOK NEVER CHANGES THE ANSWER. Two measured failures say why (2026-09-23):
# shortening the answer here, or on the leaf `0x1b780` that every reader shares, made the
# attack deal ZERO damage. The hit lands on the tick the pose counter REACHES a particular
# value, so the answer stays and the COUNTER is dragged towards it — which this handler does
# right here, where `frames` for the pose running this very tick is in `r0`, clamped to it.
# ⛔ An earlier revision did that from a second hook on `0x508bc` against a length recorded
# by the PREVIOUS tick; `0x508bc` runs before the arm asks, so any pose that got shorter
# (another weapon, another FACING, the next step of a skill script) had its counter stepped
# over — no completed pose, no hit test, no damage. That hook is gone.
[[entry.hook]]
kind = "atk_speed_lgt"
pc = 0x4af13       # lsls r0,r0,#0x18 (tail of 0x4aee0)
flavor = "main"   # 163차: 개정판 only — vanilla keeps the game's own instruction
exit_pc = 0x4af15  # asrs r0,r0,#0x18

# ★★★ 132차-C — and the frame EVENTS that drag steps over. A hit does not come from a pose
# ending: every tick the state machine hands the CURRENT counter to one function,
# `0x4b92c(frame)`, called only from here, whose switch (`0x57c3c`) applies the attack on
# fixed frames (traced: pose 2 on frame 2, pose 3 on 1 AND 4, pose 4 on 2). A tick dragged
# from c to c' dispatched c' only, so a combo's 2nd and 3rd attacks lost their hits at speed.
# This hook runs `0x4b92c` for each skipped frame first, then the displaced call itself —
# every frame gets its event once, as unhooked. With the stat off it is exactly the `bl`.
[[entry.hook]]
kind = "atk_event_lgt"
pc = 0x50e2d       # bl 0x4b92c (both halfwords displaced: fa f7 7e fd)
flavor = "main"   # 163차: 개정판 only — vanilla keeps the game's own instruction
exit_pc = 0x50e31  # b 0x51248 — past the 4-byte call

# And the other four ticks: state 4's RECOVERY countdown. Its arm does not use the pose
# comparison at all — `0x51062`/`0x51086` just tick `CHAR+0x251` (= `r6+0x19d`) down by one
# and call the idle reset `0x50774` when it reaches 0. Measured by diffing CHAR across one
# attack: 4, 3, 2, 1, 0. ★ Unlike the pose sites this test is `<= 0`, not `==`, so taking
# off more than one is safe by construction.
[[entry.hook]]
kind = "atk_recover_lgt"
pc = 0x51069       # subs r3,#1  (sub-mode 3)
flavor = "main"   # 163차: 개정판 only — vanilla keeps the game's own instruction
exit_pc = 0x5106b  # strb r3,[r2]

[[entry.hook]]
kind = "atk_recover_lgt"
pc = 0x5108d       # subs r3,#1  (sub-mode 4, same countdown)
flavor = "main"   # 163차: 개정판 only — vanilla keeps the game's own instruction
exit_pc = 0x5108f

# ── NO AUTOSAVE ON 제련 / 일반조합 (2026-09-15, player decision) ──────────────
#
# The player has fought a chronic save-corruption bug for many builds ("몇번째 계속
# 해결하려하는데 안되는"). Their decision: stop the game from writing the save the
# instant a 제련/조합 commits, and let the result persist on the ordinary 5-minute
# autosave / a manual SAVE / the on-quit save instead. Trading a lost 제련 on a hard
# crash for a save that stops being rewritten dozens of times a session is exactly the
# trade they asked for — "그냥 이거 ... 자동 저장되는 로직 제거".
#
# Both commit routines run the SAME 4-step chain (serialiseSave → writeSaveRecord →
# slotSummary → writeSaveRecord) inline and then fall through to a UI call. Each patch is
# ONE forward branch that jumps over the whole chain and lands on that trailing call, so
# the window still closes and the item is still in memory — only the disk write is gone.
# The bag-compaction call that PRECEDES the chain (`0x55048`) is kept in both.
#
#   제련  commit `0x25234`: chain at 0x254a0..0x254c2 (72차 recorded 0x254ae/0x254c0).
#            0x254a0 `ldr r3,[pc,#0x94]` (serialiseSave|1) → `b 0x254c6` (the `bl 0x201cc`).
#   조합  commit `0x24fd4`: chain at 0x25164..0x25182 (72차 recorded 0x2516e/0x2517c).
#            0x2515e `movs r3,#0` (serialiseSave out-len init) → `b 0x25186` (past the chain).
#
# Encoding: refine 0x254c6-(0x254a0+4)=0x22, imm11=0x11 → `11 e0`. craft
# 0x25186-(0x2515e+4)=0x24, imm11=0x12 → `12 e0`. `expect` pins each original halfword so
# a drifted build refuses to boot rather than branch into the wrong place.
#
# ⚠ The slot-list SUMMARY (the `slotSummary`+SlotSave half) is skipped too, but it is
# rewritten by the next real save, the `04 3d` ack, and the 72차-D summary_repair_poll —
# so a 제련-then-crash cannot leave a 빈슬롯. ⚠ The 재료가방 (94차) relies on a save
# landing while a crafting window is open to make in-flight materialised units durable;
# with these gone, that durability drops to the 5-minute autosave (a crash mid-window can
# lose the pushed-back materials — a LOSS, never a dup, which is the accepted direction).
# ⛛ ORB결합 has no guest save of its own — its host-armed retry is removed in emulator.rs.
[[entry.patch]]
pc = 0x254a0
bytes = "11 e0"
expect = "25 4b"
[[entry.patch]]
pc = 0x2515e
bytes = "12 e0"
expect = "00 23"

