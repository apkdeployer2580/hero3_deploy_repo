[package]
name = "wie_util"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { workspace = true }
tracing = { workspace = true }
tracing-attributes = { version = "<0.1.29" } # Pin this to avoid compile error with no-std https://github.com/tokio-rs/tracing/issues/3388

[lints.rust]
# `--cfg hero3_vanilla` is set by build_android.ps1 from android_app/flavor.properties
# (BRANCHES.md), not by a cargo feature — declare it or every build warns `unexpected_cfgs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hero3_vanilla)'] }
